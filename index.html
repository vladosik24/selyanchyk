<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>🌾 Селянчик v2.1</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@600;700;800;900&display=swap');

:root {
  --bg: #1a3a2a;
  --card: #2d5a3f;
  --wood: #5a3a1e;
  --wood2: #7a5230;
  --accent: #FFD93D;
  --orange: #FF8C42;
  --green: #6BCB77;
  --blue: #4FC3F7;
  --red: #FF6B6B;
  --purple: #B388FF;
  --text: #fff;
  --dim: #a8d5ba;
  --shadow: 0 4px 18px rgba(0,0,0,0.35);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Nunito', sans-serif;
  background: linear-gradient(180deg, #1a3a2a 0%, #0f2418 100%);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 92px;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(107,203,119,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 80%, rgba(255,217,61,0.08) 0%, transparent 50%);
  pointer-events:none; z-index:0;
}

/* ===== HEADER ===== */
.header {
  position:sticky; top:0; z-index:100;
  background: linear-gradient(135deg, #1e4d32, #2d6b48);
  padding: 10px 12px 12px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow: 0 4px 22px rgba(0,0,0,0.45);
  border-bottom: 3px solid var(--accent);
}
.header-left { display:flex; align-items:center; gap:10px; }
.avatar {
  width:44px; height:44px; border-radius:50%;
  background: linear-gradient(145deg, #FFD93D, #FF8C42);
  display:flex; align-items:center; justify-content:center;
  font-size:24px; border:2px solid rgba(255,255,255,0.4);
  box-shadow: 0 2px 10px rgba(255,217,61,0.4);
}
.pinfo h1 { font-family:'Comfortaa',sans-serif; font-size:15px; font-weight:700; line-height:1.15; }
.pinfo .lvl { font-size:11px; color:var(--accent); font-weight:700; }
.header-right { display:flex; align-items:center; gap:8px; }
.coins {
  background:rgba(0,0,0,0.35); padding:6px 13px; border-radius:20px;
  font-weight:800; font-size:15px; color:var(--accent);
  border:1px solid rgba(255,217,61,0.3); display:flex; align-items:center; gap:5px;
}
.icon-btn {
  width:36px; height:36px; border-radius:50%;
  background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.15);
  font-size:17px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:#fff;
}

/* ===== RESOURCES ===== */
.resources {
  display:flex; gap:7px; padding:9px 12px; overflow-x:auto; position:relative; z-index:1;
}
.resources::-webkit-scrollbar { display:none; }
.res {
  flex-shrink:0; display:flex; align-items:center; gap:4px;
  background:rgba(0,0,0,0.28); padding:5px 11px; border-radius:14px;
  font-size:13px; font-weight:700; border:1px solid rgba(255,255,255,0.07);
}

/* ===== CONTENT ===== */
.content { padding:4px 12px 16px; position:relative; z-index:1; }
.section { display:none; }
.section.active { display:block; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.stitle {
  font-family:'Comfortaa',sans-serif; font-size:17px; font-weight:700;
  margin:4px 0 11px; display:flex; align-items:center; justify-content:space-between;
}

/* ===== FARM ===== */
.farm-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:13px;
}
.plot {
  aspect-ratio:1; border-radius:14px; display:flex; flex-direction:column;
  align-items:center; justify-content:center; cursor:pointer; position:relative;
  overflow:hidden; transition:transform .14s;
  box-shadow: var(--shadow), inset 0 -3px 6px rgba(0,0,0,0.25);
}
.plot:active { transform:scale(0.95); }
.plot.empty {
  background:linear-gradient(160deg,#5a3a1e,#3d2814); border:3px solid #7a5230;
}
.plot.empty::after { content:'+'; font-size:30px; color:rgba(255,255,255,0.28); font-weight:300; }
.plot.locked {
  background:#151515; border:3px dashed #333; opacity:0.55;
}
.plot.locked::after { content:'🔒'; font-size:22px; }
.plot.growing, .plot.ready {
  background:linear-gradient(160deg,#4a2f16,#6b4226); border:3px solid #8b5a2b;
}
.plot.ready {
  border-color:#6BCB77;
  box-shadow:0 0 18px rgba(107,203,119,0.45), var(--shadow);
  animation:pulse 1.5s ease-in-out infinite;
}
@keyframes pulse {
  0%,100%{box-shadow:0 0 12px rgba(107,203,119,0.3)}
  50%{box-shadow:0 0 22px rgba(107,203,119,0.55)}
}
.plot .em { font-size:36px; filter:drop-shadow(0 3px 4px rgba(0,0,0,0.45)); line-height:1; }
.plot .tm {
  font-size:10px; font-weight:800; margin-top:3px;
  background:rgba(0,0,0,0.5); padding:2px 7px; border-radius:8px; color:var(--accent);
}
.plot.ready .tm { color:#6BCB77; }

/* ===== SEED PANEL ===== */
.seed-panel {
  background:linear-gradient(180deg,#2d5a3f,#234a32); border-radius:16px;
  padding:12px; border:1px solid rgba(255,255,255,0.08); box-shadow:var(--shadow);
}
.seed-panel h3 { font-family:'Comfortaa',sans-serif; font-size:13px; color:var(--accent); margin-bottom:9px; }
.seed-list { display:flex; gap:7px; overflow-x:auto; }
.seed-list::-webkit-scrollbar { display:none; }
.seed {
  flex-shrink:0; width:66px; background:rgba(0,0,0,0.28); border-radius:13px;
  padding:7px 3px; text-align:center; cursor:pointer; border:2px solid transparent; transition:.15s;
}
.seed.selected { border-color:var(--accent); background:rgba(255,217,61,0.16); box-shadow:0 0 10px rgba(255,217,61,0.18); }
.seed.locked { opacity:0.4; }
.seed .e { font-size:25px; display:block; }
.seed .n { font-size:9px; font-weight:700; margin-top:2px; display:block; }
.seed .p { font-size:10px; color:var(--accent); }

/* ===== TABS / CARDS ===== */
.tabs { display:flex; gap:6px; margin-bottom:11px; overflow-x:auto; }
.tabs::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0; padding:7px 13px; border-radius:12px; background:rgba(0,0,0,0.28);
  font-size:13px; font-weight:700; cursor:pointer; border:2px solid transparent; white-space:nowrap;
}
.tab.active { background:linear-gradient(135deg,#45a55a,#2d7a4f); border-color:rgba(255,255,255,0.15); }

.card {
  background:var(--card); border-radius:14px; padding:12px; margin-bottom:8px;
  display:flex; align-items:center; gap:11px;
  border:1px solid rgba(255,255,255,0.06); box-shadow:0 3px 12px rgba(0,0,0,0.25);
}
.card-ico {
  width:48px; height:48px; background:rgba(0,0,0,0.3); border-radius:12px;
  display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;
}
.card-info { flex:1; min-width:0; }
.card-info h4 { font-size:14px; font-weight:700; }
.card-info p { font-size:11px; color:var(--dim); margin-top:2px; }
.btn-p {
  background:linear-gradient(135deg,#FFD93D,#FF8C42); color:#1a1a1a;
  padding:6px 12px; border-radius:10px; font-size:13px; font-weight:800;
  border:none; cursor:pointer; white-space:nowrap;
}
.btn-p:disabled { background:#555; color:#aaa; cursor:default; }

/* ===== ANIMALS ===== */
.animals-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; }
.animal {
  background:var(--card); border-radius:14px; padding:13px 8px; text-align:center;
  border:1px solid rgba(255,255,255,0.06); cursor:pointer; box-shadow:0 3px 12px rgba(0,0,0,0.25);
}
.animal .e { font-size:40px; display:block; margin-bottom:3px; animation:bounce 2.2s ease-in-out infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
.animal.locked { opacity:0.45; }
.animal.locked .e { animation:none; filter:grayscale(.7); }
.animal h4 { font-size:13px; }
.animal .st { font-size:11px; color:var(--green); margin-top:2px; }
.animal .pr { font-size:11px; color:var(--accent); margin-top:3px; }

/* ===== RATING ===== */
.rating-item {
  background:var(--card); border-radius:12px; padding:10px 12px;
  display:flex; align-items:center; gap:10px; margin-bottom:7px;
  border:1px solid rgba(255,255,255,0.05);
}
.rating-item.me { border:2px solid var(--accent); background:linear-gradient(135deg,#3a5a2a,#2d5a3f); }
.rating-item.t1 { border-left:4px solid #FFD93D; }
.rating-item.t2 { border-left:4px solid #C0C0C0; }
.rating-item.t3 { border-left:4px solid #CD7F32; }
.pos {
  width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,0.3);
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800; flex-shrink:0;
}
.rating-item.t1 .pos { background:#FFD93D; color:#1a1a1a; }
.rating-item.t2 .pos { background:#C0C0C0; color:#1a1a1a; }
.rating-item.t3 .pos { background:#CD7F32; color:#fff; }
.r-name { flex:1; font-weight:600; font-size:14px; }
.r-score { font-weight:800; color:var(--accent); font-size:13px; }

/* ===== NAV ===== */
.nav {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:linear-gradient(180deg,rgba(15,36,24,0.97),#0a1a12);
  display:flex; padding:7px 3px 13px;
  border-top:2px solid rgba(107,203,119,0.18); box-shadow:0 -4px 20px rgba(0,0,0,0.5);
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:5px 1px; border-radius:12px; cursor:pointer; color:var(--dim);
  border:none; background:none; font-family:inherit;
}
.nav-item.active { color:var(--accent); background:rgba(255,217,61,0.1); }
.nav-item .ico { font-size:21px; }
.nav-item .lbl { font-size:9px; font-weight:700; }

/* ===== TOAST / MODAL ===== */
.toast {
  position:fixed; top:74px; left:50%; transform:translateX(-50%) translateY(-14px);
  background:linear-gradient(135deg,#2d7a4f,#1a5c35); padding:10px 18px; border-radius:14px;
  font-size:14px; font-weight:700; box-shadow:0 8px 28px rgba(0,0,0,0.5);
  z-index:999; opacity:0; pointer-events:none; transition:.28s;
  border:1px solid rgba(107,203,119,0.3); max-width:88vw; text-align:center;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.modal-bg {
  position:fixed; inset:0; background:rgba(0,0,0,0.72); z-index:200;
  display:none; align-items:flex-end; justify-content:center; backdrop-filter:blur(3px);
}
.modal-bg.open { display:flex; }
.modal {
  background:linear-gradient(180deg,#2d5a3f,#1a3a2a); border-radius:20px 20px 0 0;
  padding:18px 14px 28px; width:100%; max-width:420px; max-height:68vh; overflow-y:auto;
  border-top:3px solid var(--accent); animation:slideUp .28s ease; position:relative;
}
@keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
.modal h3 { font-family:'Comfortaa',sans-serif; font-size:17px; text-align:center; margin-bottom:14px; }

.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 18px; border:none; border-radius:12px; font-family:inherit;
  font-size:14px; font-weight:700; cursor:pointer;
}
.btn-g { background:linear-gradient(135deg,#45a55a,#2d7a4f); color:#fff; }
.btn-o { background:linear-gradient(135deg,#FF8C42,#FF6B6B); color:#fff; }
.btn-full { width:100%; margin-top:8px; }

/* ===== LOADING ===== */
.loading {
  position:fixed; inset:0; background:linear-gradient(160deg,#0d1f15,#1a3a2a);
  z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .4s;
}
.loading.hide { opacity:0; pointer-events:none; }
.loading .em { font-size:56px; animation:bounce 1s ease-in-out infinite; }
.loading .tt { font-family:'Comfortaa',sans-serif; font-size:22px; font-weight:700; margin-top:12px; color:var(--accent); }
.loading .sub { margin-top:6px; font-size:13px; color:var(--dim); }
.loading .bar { width:150px; height:5px; background:rgba(255,255,255,0.1); border-radius:3px; margin-top:14px; overflow:hidden; }
.loading .bf {
  height:100%; width:30%; background:linear-gradient(90deg,var(--green),var(--accent)); border-radius:3px;
  animation:load 1.1s ease infinite;
}
@keyframes load {
  0%{width:8%;margin-left:0} 50%{width:55%;margin-left:20%} 100%{width:8%;margin-left:90%}
}

.sync {
  position:fixed; top:6px; right:8px; z-index:150; font-size:10px; font-weight:700;
  padding:2px 7px; border-radius:8px; background:rgba(0,0,0,0.4); color:var(--dim); pointer-events:none;
}
.sync.ok { color:var(--green); }
.sync.bad { color:#FF8C42; }

.inv-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; margin-top:10px; }
.inv-slot {
  aspect-ratio:1; background:rgba(0,0,0,0.28); border-radius:12px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:2px solid rgba(255,255,255,0.06); position:relative; cursor:pointer;
}
.inv-slot .e { font-size:24px; }
.inv-slot .c {
  position:absolute; bottom:3px; right:4px; font-size:10px; font-weight:800;
  background:rgba(0,0,0,0.55); padding:1px 5px; border-radius:6px; color:var(--accent);
}

.daily {
  background:linear-gradient(135deg,#5a3a1a,#3d2a10); border:2px solid var(--accent);
  border-radius:14px; padding:11px; margin-bottom:11px; text-align:center; cursor:pointer;
}
.daily h4 { color:var(--accent); font-size:14px; }
.daily p { font-size:12px; color:var(--dim); margin-top:3px; }

.progress { height:5px; background:rgba(0,0,0,0.35); border-radius:3px; margin-top:5px; overflow:hidden; }
.progress > div { height:100%; background:linear-gradient(90deg,var(--green),var(--accent)); border-radius:3px; transition:width .35s; }

.ver { position:fixed; bottom:96px; right:8px; font-size:9px; color:rgba(255,255,255,0.2); z-index:50; }

.clan-box {
  background:linear-gradient(135deg,#2a1a4a,#3d2560); border-radius:16px; padding:18px;
  text-align:center; border:1px solid rgba(179,136,255,0.2); margin-bottom:10px;
}
</style>
</head>
<body>

<div class="loading" id="loading">
  <div class="em">🌾</div>
  <div class="tt">Селянчик</div>
  <div class="sub" id="loadText">Завантаження...</div>
  <div class="bar"><div class="bf"></div></div>
</div>

<div class="sync" id="sync">⏳</div>
<div class="toast" id="toast"></div>
<div class="ver">v2.1</div>

<div class="header">
  <div class="header-left">
    <div class="avatar">👨‍🌾</div>
    <div class="pinfo">
      <h1 id="name">Селянчик</h1>
      <div class="lvl" id="level">⭐ Рівень 1</div>
    </div>
  </div>
  <div class="header-right">
    <button class="icon-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
    <div class="coins"><span>🪙</span><span id="coins">0</span></div>
  </div>
</div>

<div class="resources">
  <div class="res">⚡ <span id="energy">50/50</span></div>
  <div class="res">💧 <span id="water">100</span></div>
  <div class="res">🌟 <span id="xp">0</span></div>
  <div class="res">🔥 <span id="streak">0</span></div>
</div>

<div class="content">
  <!-- FARM -->
  <div class="section active" id="sec-farm">
    <div class="daily" id="daily" style="display:none" onclick="claimDaily()">
      <h4>🎁 Щоденна нагорода</h4>
      <p id="dailyText">Натисни, щоб забрати</p>
    </div>
    <div class="stitle">
      <span>🌱 Моя ферма</span>
      <span style="font-size:12px;color:var(--dim)" id="plots">9/12</span>
    </div>
    <div class="farm-grid" id="farm"></div>
    <div class="seed-panel">
      <h3>🌰 Обери насіння</h3>
      <div class="seed-list" id="seeds"></div>
    </div>
  </div>

  <!-- SHOP -->
  <div class="section" id="sec-shop">
    <div class="stitle">🏪 Магазин</div>
    <div class="tabs" id="shopTabs"></div>
    <div id="shopItems"></div>
    <div class="stitle" style="margin-top:14px">
      <span>🎒 Інвентар</span>
      <button class="btn btn-o" style="padding:4px 10px;font-size:12px" onclick="sellAll()">Продати все</button>
    </div>
    <div class="inv-grid" id="inv"></div>
  </div>

  <!-- ANIMALS -->
  <div class="section" id="sec-animals">
    <div class="stitle">🐄 Тварини</div>
    <div class="animals-grid" id="animals"></div>
    <div class="stitle" style="margin-top:14px">🚜 Транспорт</div>
    <div id="transport"></div>
  </div>

  <!-- QUESTS -->
  <div class="section" id="sec-quests">
    <div class="stitle">📜 Завдання</div>
    <div class="tabs">
      <div class="tab active" onclick="setQTab(this,'daily')">📅 Щоденні</div>
      <div class="tab" onclick="setQTab(this,'ach')">🏆 Досягнення</div>
    </div>
    <div id="quests"></div>
  </div>

  <!-- RATING -->
  <div class="section" id="sec-rating">
    <div class="stitle">🏆 Рейтинг</div>
    <div class="tabs">
      <div class="tab active" onclick="setRTab(this,'players')">👥 Гравці</div>
      <div class="tab" onclick="setRTab(this,'clans')">🏰 Клани</div>
    </div>
    <div id="rating"></div>
  </div>
</div>

<div class="nav">
  <button class="nav-item active" onclick="go('farm',this)"><span class="ico">🌾</span><span class="lbl">Ферма</span></button>
  <button class="nav-item" onclick="go('shop',this)"><span class="ico">🏪</span><span class="lbl">Магазин</span></button>
  <button class="nav-item" onclick="go('animals',this)"><span class="ico">🐄</span><span class="lbl">Тварини</span></button>
  <button class="nav-item" onclick="go('quests',this)"><span class="ico">📜</span><span class="lbl">Завдання</span></button>
  <button class="nav-item" onclick="go('rating',this)"><span class="ico">🏆</span><span class="lbl">Рейтинг</span></button>
</div>

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ===================== SOUND ===================== */
class SFX {
  constructor(){ this.ctx=null; this.on=true; this.music=true; this.g=null; this.started=false; }
  init(){
    if(this.ctx) return;
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.g=this.ctx.createGain(); this.g.gain.value=0.32; this.g.connect(this.ctx.destination);
    }catch(e){}
  }
  resume(){ if(this.ctx?.state==='suspended') this.ctx.resume(); }
  tone(f,type,dur,vol=0.28,delay=0){
    if(!this.on||!this.ctx) return; this.resume();
    const o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0,this.ctx.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol,this.ctx.currentTime+delay+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+delay+dur);
    o.connect(g); g.connect(this.g);
    o.start(this.ctx.currentTime+delay); o.stop(this.ctx.currentTime+delay+dur+0.04);
  }
  plant(){ this.tone(220,'triangle',0.14,0.22); this.tone(330,'sine',0.18,0.18,0.07); }
  harvest(){ this.tone(523,'sine',0.1,0.28); this.tone(659,'sine',0.13,0.22,0.07); this.tone(784,'sine',0.18,0.18,0.14); }
  coin(){ this.tone(880,'sine',0.07,0.22); this.tone(1175,'sine',0.11,0.18,0.05); }
  buy(){ this.tone(392,'triangle',0.09,0.22); this.tone(523,'triangle',0.13,0.18,0.07); }
  level(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,'sine',0.22,0.28,i*0.11)); }
  click(){ this.tone(600,'sine',0.04,0.12); }
  animal(){ this.tone(300,'sawtooth',0.09,0.14); this.tone(450,'triangle',0.13,0.11,0.07); }
  err(){ this.tone(150,'sawtooth',0.18,0.18); }
  daily(){ [440,554,659,880].forEach((f,i)=>this.tone(f,'sine',0.18,0.22,i*0.09)); }
  startMusic(){
    if(!this.music||!this.on||!this.ctx||this.started) return;
    this.started=true; this.resume(); this.loopMusic();
  }
  loopMusic(){
    if(!this.music||!this.on) return;
    const notes=[[262,0.35],[294,0.35],[330,0.35],[349,0.35],[392,0.5],[349,0.25],[330,0.35],[294,0.35],[262,0.45],[294,0.25],[330,0.4],[262,0.6]];
    let t=0; notes.forEach(([f,d])=>{ this.tone(f,'triangle',d*0.85,0.05,t); t+=d; });
    setTimeout(()=>{ if(this.music&&this.on) this.loopMusic(); }, t*1000+900);
  }
  toggle(){ this.on=!this.on; if(!this.on) this.music=false; return this.on; }
}

/* ===================== OFFLINE + DAILY ===================== */
function offline(){
  if(!state.lastOnline){ state.lastOnline=Date.now(); return; }
  const sec=Math.floor((Date.now()-state.lastOnline)/1000);
  if(sec<20) return;
  let animalGain=0;
  Object.keys(state.animals).forEach(id=>{
    const a=ANIMALS.find(x=>x.id===id); if(!a) return;
    const own=state.animals[id];
    const el=(Date.now()-(own.lastCollect||0))/1000;
    if(el>=a.i){
      const times=Math.min(Math.floor(el/a.i),8);
      animalGain+=times*a.r;
      own.lastCollect=Date.now()-(el%a.i)*1000;
    }
  });
  const eg=Math.min(state.maxEnergy-state.energy, Math.floor(sec/50));
  state.energy=Math.min(state.maxEnergy, state.energy+eg);
  if(animalGain>0){
    state.coins+=animalGain; state.stats.earned+=animalGain;
    toast(`💤 Офлайн +${animalGain}🪙`);
  }
  state.lastOnline=Date.now();
}

function checkDaily(){
  const today=new Date().toDateString();
  const last=state.lastLogin?new Date(state.lastLogin).toDateString():null;
  if(last===today){
    state.claimedDaily=true;
    document.getElementById('daily').style.display='none';
    return;
  }
  if(last){
    const y=new Date(); y.setDate(y.getDate()-1);
    state.streak=(last===y.toDateString())?(state.streak||0)+1:1;
  } else state.streak=1;
  state.claimedDaily=false;
  state.lastLogin=Date.now();
  document.getElementById('daily').style.display='block';
  document.getElementById('dailyText').textContent=`Стрік ${state.streak} дн. • Натисни`;
  checkAch('streak_7'); checkAch('streak_30');
}

function claimDaily(){
  if(state.claimedDaily) return;
  const s=state.streak||1;
  const c=50+s*20, x=10+s*5;
  state.coins+=c; state.xp+=x;
  state.energy=state.maxEnergy;
  state.claimedDaily=true;
  state.stats.earned+=c;
  document.getElementById('daily').style.display='none';
  toast(`🎁 +${c}🪙 +${x}XP`);
  sfx.daily(); levelUp(); save(); render();
}

function checkAch(id){

  const a=ACH.find(x=>x.id===id); if(!a) return;
  let ok=false;
  if(id==='first_plant'&&state.stats.planted>=1) ok=true;
  if(id==='level_5'&&state.level>=5) ok=true;
  if(id==='level_10'&&state.level>=10) ok=true;
  if(id==='rich_1k'&&state.coins>=1000) ok=true;
  if(id==='rich_10k'&&state.coins>=10000) ok=true;
  if(id==='animal_lover'&&Object.keys(state.animals).length>=3) ok=true;
  if(id==='harvest_50'&&state.stats.harvested>=50) ok=true;
  if(id==='harvest_200'&&state.stats.harvested>=200) ok=true;
  if(id==='streak_7'&&state.streak>=7) ok=true;
  if(id==='streak_30'&&state.streak>=30) ok=true;

function renderFarm(){
  const g=document.getElementById('farm'); g.innerHTML='';
  for(let i=0;i<12;i++){
    const d=document.createElement('div');
    if(i>=state.unlocked){
      d.className='plot locked';
      d.onclick=()=>{
        const cost=200+i*100;
        if(state.coins<cost) return toast('❌ Не вистачає монет');
        if(state.level<Math.floor(i/3)+1) return toast(`🔒 Рівень ${Math.floor(i/3)+1}`);
        state.coins-=cost; state.unlocked=i+1;
        toast('🔓 Грядку відкрито!'); sfx.buy(); save(); render();
      };
    } else {
      const cell=state.farm[i];
      if(!cell){ d.className='plot empty'; d.onclick=()=>plant(i); }
      else {
        const s=SEEDS.find(x=>x.id===cell.seedId);
        if(!s){ d.className='plot empty'; d.onclick=()=>plant(i); }
        else {
          const el=(Date.now()-cell.at)/1000;
          const ready=el>=cell.t;
          d.className='plot '+(ready?'ready':'growing');
          d.innerHTML=`<span class="em">${s.e}</span><span class="tm">${ready?'✅ Збери!':'⏳ '+fmtT(cell.t-el)}</span>`;
          d.onclick=()=>ready?harvest(i):toast('⏳ Ще росте...');
        }
      }
    }
    g.appendChild(d);
  }
}

function renderSeeds(){
  const l=document.getElementById('seeds'); l.innerHTML='';
  SEEDS.forEach(s=>{
    const locked=state.level<s.u;
    const d=document.createElement('div');
    d.className='seed'+(state.seed===s.id?' selected':'')+(locked?' locked':'');
    d.innerHTML=`<span class="e">${s.e}</span><span class="n">${s.n}</span><span class="p">${locked?'🔒'+s.u:'🪙'+s.p}</span>`;
    d.onclick=()=>{ if(locked) return toast(`🔒 Рівень ${s.u}`); state.seed=s.id; renderSeeds(); sfx.click(); };
    l.appendChild(d);
  });
}

function plant(i){
  const s=SEEDS.find(x=>x.id===state.seed); if(!s) return;
  if(state.level<s.u) return toast(`🔒 Рівень ${s.u}`);
  if(state.coins<s.p){ sfx.err(); return toast('❌ Не вистачає монет'); }
  if(state.energy<5){ sfx.err(); return toast('❌ Немає енергії'); }
  state.coins-=s.p; state.energy-=5;
  state.farm[i]={seedId:s.id,at:Date.now(),t:s.t};
  state.stats.planted++; qProg('plant'); checkAch('first_plant');
  toast(`🌱 ${s.n}`); sfx.plant(); save(); render();
}

function harvest(i){
  const cell=state.farm[i]; if(!cell) return;
  const s=SEEDS.find(x=>x.id===cell.seedId);
  if(!s){ state.farm[i]=null; render(); return; }
  let r=s.r;
  if(state.transport.tractor) r=Math.floor(r*1.2);
  state.coins+=r; state.xp+=s.xp; state.farm[i]=null;
  state.inv[s.id]=(state.inv[s.id]||0)+1;
  state.stats.harvested++; state.stats.earned+=r;
  qProg('harvest'); qProg('coins',r);
  checkAch('harvest_50'); checkAch('harvest_200'); checkAch('rich_1k'); checkAch('rich_10k');
  levelUp(); toast(`🎉 +${r}🪙 +${s.xp}XP`); sfx.harvest(); save(); saveRating(); render();
}

function buy(id,p,n){
  if(state.coins<p){ sfx.err(); return toast('❌ Не вистачає'); }
  state.coins-=p; state.inv[id]=(state.inv[id]||0)+1;
  if(id==='energy_drink'){ state.energy=Math.min(state.maxEnergy,state.energy+25); state.inv[id]--; if(state.inv[id]<=0) delete state.inv[id]; }
  if(id==='well'){ state.water+=50; state.inv[id]--; if(state.inv[id]<=0) delete state.inv[id]; }
  if(id==='xp_boost'){ state.xp+=50; state.inv[id]--; if(state.inv[id]<=0) delete state.inv[id]; levelUp(); }
  toast(`✅ ${n}`); sfx.buy(); save(); render();
}

function renderInv(){
  const g=document.getElementById('inv'); g.innerHTML='';
  const all=[...SEEDS,...SHOP.tools,...SHOP.boosts,...SHOP.decor];
  let has=false;
  Object.entries(state.inv).forEach(([id,c])=>{
    if(c<=0) return; const it=all.find(x=>x.id===id); if(!it) return; has=true;
    const d=document.createElement('div'); d.className='inv-slot';
    d.innerHTML=`<span class="e">${it.e}</span><span class="c">×${c}</span>`;
    d.onclick=()=>itemModal(it,c); g.appendChild(d);
  });
  if(!has) g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--dim);padding:18px;font-size:13px">Порожньо</div>';
}

function sellAll(){
  const all=[...SEEDS,...SHOP.tools,...SHOP.boosts,...SHOP.decor];
  let tot=0;
  Object.entries(state.inv).forEach(([id,c])=>{
    const it=all.find(x=>x.id===id); if(!it) return;
    tot+=Math.floor((it.p||10)*0.6)*c;
  });
  if(tot<=0) return toast('Немає чого продавати');
  state.inv={}; state.coins+=tot; state.stats.earned+=tot;
  toast(`💰 +${tot}🪙`); sfx.coin(); save(); render();
}

/* ANIMALS */
function renderAnimals(){
  const g=document.getElementById('animals'); g.innerHTML='';
  ANIMALS.forEach(a=>{
    const own=state.animals[a.id]; const lock=state.level<a.u&&!own;
    const d=document.createElement('div'); d.className='animal'+(lock?' locked':'');
    let st='';
    if(lock) st=`🔒 Lv.${a.u}`;
    else if(own){ const el=(Date.now()-(own.lastCollect||0))/1000; st=el>=a.i?'✅ Забери!':'⏳ '+fmtT(a.i-el); }
    else st=`🪙 ${a.p}`;
    d.innerHTML=`<span class="e">${a.e}</span><h4>${a.n}</h4><div class="st">${st}</div><div class="pr">${a.pr}</div>`;
    d.onclick=()=>{ if(lock) return toast(`🔒 Рівень ${a.u}`); if(!own) return buyAnimal(a); collectAnimal(a); };
    g.appendChild(d);
  });
}

function buyAnimal(a){
  if(state.coins<a.p){ sfx.err(); return toast('❌ Не вистачає'); }
  state.coins-=a.p; state.animals[a.id]={owned:true,lastCollect:Date.now()};
  state.stats.boughtAnimals=(state.stats.boughtAnimals||0)+1;
  qProg('buy_animal'); checkAch('animal_lover');
  toast(`🎉 ${a.n}`); sfx.buy(); save(); render();
}

function collectAnimal(a){
  const o=state.animals[a.id]; if(!o) return;
  const el=(Date.now()-(o.lastCollect||0))/1000;
  if(el<a.i) return toast('⏳ Ще не готово');
  state.coins+=a.r; state.xp+=Math.floor(a.r/4); o.lastCollect=Date.now();
  state.stats.animals++; state.stats.earned+=a.r;
  qProg('animal'); qProg('coins',a.r); levelUp();
  toast(`🎉 +${a.r}🪙`); sfx.animal(); save(); saveRating(); render();
}

function renderTransport(){
  const l=document.getElementById('transport'); l.innerHTML='';
  TRANSPORT.forEach(t=>{
    const own=state.transport[t.id];
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<div class="card-ico">${t.e}</div><div class="card-info"><h4>${t.n} ${own?'✅':''}</h4><p>${t.d}</p><div class="progress"><div style="width:${t.s}%"></div></div></div>${!own?`<button class="btn-p">🪙${t.p}</button>`:''}`;
    if(!own) d.querySelector('button').onclick=()=>{
      if(state.coins<t.p){ sfx.err(); return toast('❌ Не вистачає'); }
      state.coins-=t.p; state.transport[t.id]=true;
      toast(`🎉 ${t.n}`); sfx.buy(); save(); render();
    };
    l.appendChild(d);
  });
}

/* QUESTS */
function setQTab(el,ty){
  document.querySelectorAll('#sec-quests .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); renderQ(ty); sfx.click();
}

function renderQ(ty='daily'){
  const box=document.getElementById('quests'); if(!box) return;
  if(ty==='ach'){
    box.innerHTML=ACH.map(a=>{
      const done=state.ach[a.id];
      return `<div class="card" style="opacity:${done?1:0.5}"><div class="card-ico">${a.e}</div><div class="card-info"><h4>${a.n} ${done?'✅':''}</h4><p>${a.d}</p></div></div>`;
    }).join('');
    return;
  }
  box.innerHTML=QUESTS.map(q=>{
    const p=Math.min(state.qProg[q.id]||0,q.t);
    const claimed=state.quests[q.id+'_c'];
    const ready=p>=q.t&&!claimed;
    return `<div class="card"><div class="card-ico">📜</div><div class="card-info"><h4>${q.n}</h4><p>${p}/${q.t} • ${q.r}🪙</p><div class="progress"><div style="width:${(p/q.t)*100}%"></div></div></div><button class="btn-p" ${ready?'':'disabled'} style="${claimed?'background:#555;color:#aaa':''}" onclick="claimQ('${q.id}')">${claimed?'✅':ready?'Забрати':'...'}</button></div>`;
  }).join('');
}

/* RATING */
function setRTab(el,ty){
  document.querySelectorAll('#sec-rating .tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active'); renderRating(ty); sfx.click();
}

async function renderRating(ty='players'){
  const box=document.getElementById('rating');
  if(ty==='clans'){
    box.innerHTML=`<div class="clan-box"><div style="font-size:42px">🏰</div><h3 style="color:var(--purple);font-family:Comfortaa;margin:6px 0">${state.clan||'Без клану'}</h3><p style="color:var(--dim);font-size:12px">${state.clan?'Твій клан':'Скоро з\'являться!'}</p></div>`;
    return;
  }
  let list=[];
  if(fbReady&&db){
    try{
      const q=fb.query(fb.ref(db,'rating'),fb.orderByChild('xp'),fb.limitToLast(30));
      const snap=await Promise.race([fb.get(q),new Promise((_,r)=>setTimeout(r,2000))]);
      if(snap.exists()){ snap.forEach(c=>list.push({id:c.key,...c.val()})); list.sort((a,b)=>(b.xp||0)-(a.xp||0)); }
    }catch(e){}
  }
  const myName=document.getElementById('name').textContent;
  if(!list.some(p=>p.id===uid)) list.push({id:uid,name:myName,level:state.level,xp:state.xp});
  list.sort((a,b)=>(b.xp||0)-(a.xp||0));
  if(list.length===0) list=[{id:uid,name:myName,level:state.level,xp:state.xp},{name:'Оксана',level:5,xp:320},{name:'Тарас',level:4,xp:250}];
  const myPos=list.findIndex(p=>p.id===uid)+1;
  box.innerHTML=`<div style="text-align:center;margin-bottom:10px;font-size:13px;color:var(--dim)">Твоя позиція: <b style="color:var(--accent)">#${myPos||'—'}</b></div>`+
    list.slice(0,25).map((p,i)=>{
      const me=p.id===uid;
      const tc=i===0?' t1':i===1?' t2':i===2?' t3':'';
      return `<div class="rating-item${tc}${me?' me':''}"><div class="pos">${i+1}</div><div class="r-name">${p.name||'Гравець'}${me?' (Ти)':''} <span style="font-size:11px;color:var(--dim)">Lv.${p.level||1}</span></div><div class="r-score">${fmt(p.xp||0)} XP</div></div>`;
    }).join('');
}

/* MODAL */
function itemModal(it,c){
  const price=Math.floor((it.p||10)*0.6);
  document.getElementById('modal').innerHTML=`<h3>${it.e} ${it.n}</h3><p style="text-align:center;color:var(--dim);margin-bottom:14px">×${c}</p><div style="text-align:center"><button class="btn btn-o" id="sellOne">Продати 🪙${price}</button></div>`;
  document.getElementById('sellOne').onclick=()=>{
    if(!state.inv[it.id]||state.inv[it.id]<=0) return;
    state.inv[it.id]--; if(state.inv[it.id]<=0) delete state.inv[it.id];
    state.coins+=price; state.stats.earned+=price;
    toast(`💰 +${price}🪙`); sfx.coin();
    document.getElementById('modalBg').classList.remove('open'); save(); render();
  };
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(e){ if(e.target.id==='modalBg') document.getElementById('modalBg').classList.remove('open'); }

/* LEVEL */
function levelUp(){
  const need=state.level*100;
  if(state.xp>=need){
    state.level++; state.xp-=need;
    state.maxEnergy+=10; state.energy=state.maxEnergy;
    if(state.level%2===0&&state.unlocked<12) state.unlocked=Math.min(12,state.unlocked+1);
    toast(`🎉 Рівень ${state.level}!`); sfx.level();
    checkAch('level_5'); checkAch('level_10');
  }
}

/* UTILS */
function fmtT(s){ if(s<=0)return'0с'; const m=Math.floor(s/60),sec=Math.floor(s%60); return m>0?`${m}хв ${sec}с`:`${sec}с`; }
function fmt(n){ if(n>=1e6)return(n/1e6).toFixed(1)+'M'; if(n>=1000)return(n/1000).toFixed(1)+'K'; return String(Math.floor(n)); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function go(id,el){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  if(el) el.classList.add('active'); sfx.click();
  if(id==='quests') renderQ();
  if(id==='rating') renderRating();
}
function toggleSound(){ const on=sfx.toggle(); state.settings.sound=on; document.getElementById('soundBtn').textContent=on?'🔊':'🔇'; saveLocal(); if(on)sfx.click(); }

/* INIT */
async function init(){
  try{
    if(window.Telegram?.WebApp){
      Telegram.WebApp.ready(); Telegram.WebApp.expand();
      Telegram.WebApp.setHeaderColor('#1e4d32'); Telegram.WebApp.setBackgroundColor('#1a3a2a');
      const u=Telegram.WebApp.initDataUnsafe?.user;
      if(u){ uid=String(u.id); document.getElementById('name').textContent=u.first_name||'Селянчик'; }
    }
  }catch(e){}
  if(!uid) uid='local_'+Date.now();

  document.body.addEventListener('click',()=>{ sfx.init(); sfx.resume(); if(state.settings.music) sfx.startMusic(); },{once:true});

  loadLocal(); ensure(); offline(); checkDaily(); initQ(); render();
  document.getElementById('soundBtn').textContent=sfx.on?'🔊':'🔇';

  setTimeout(()=>document.getElementById('loading').classList.add('hide'),350);

  initFB().then(async()=>{
    if(fbReady){
      const cloud=await loadCloud();
      if(cloud){ ensure(); offline(); checkDaily(); initQ(); render(); toast('☁️ Прогрес з хмари'); }
      badge(true);
    } else badge(false);
  });

  setInterval(()=>{ renderFarm(); renderAnimals(); if(state.energy<state.maxEnergy){ state.energy=Math.min(state.maxEnergy,state.energy+1); renderRes(); } },5000);
  setInterval(()=>{ save(); saveRating(); },30000);

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){ state.lastOnline=Date.now(); save(); saveLocal(); }
    else { offline(); render(); }
  });
  window.addEventListener('pagehide',()=>{ state.lastOnline=Date.now(); saveLocal(); });
}

window.go=go; window.setQTab=setQTab; window.setRTab=setRTab;
window.closeModal=closeModal; window.claimDaily=claimDaily;
window.claimQ=claimQ; window.sellAll=sellAll; window.toggleSound=toggleSound;

init();
</script>
</body>
</html>
